<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sidebar-width: 250px; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f5f7fa; }
        .admin-container { display: flex; min-height: 100vh; }
        .admin-sidebar { width: var(--sidebar-width); background: linear-gradient(135deg, #2c3e50, #34495e); color: white; position: fixed; height: 100vh; padding: 20px 0; }
        .admin-sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .admin-menu { list-style: none; padding: 20px 0; margin:0;}
        .admin-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; border-left: 3px solid transparent; }
        .admin-menu a:hover, .admin-menu a.active { background: rgba(255,255,255,0.1); color: white; border-left-color: #2ecc71; }
        .admin-main { flex: 1; margin-left: var(--sidebar-width); padding: 20px; }
        .admin-header { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-number { font-size: 2rem; font-weight: bold; }
        .admin-tabs { display: none; } .admin-tabs.active { display: block; }
        .tab-content { background: white; padding: 25px; border-radius: 10px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; margin-right: 5px; }
        .btn-edit { background: #3498db; } .btn-delete { background: #e74c3c; } .btn-hide { background: #f39c12; } .btn-show { background: #2ecc71; } .btn-read { background: #9b59b6; } .btn-save { background: #2ecc71; } .btn-reply { background: #3498db; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: white; font-weight: bold; z-index: 10000; animation: slideIn 0.3s ease; }
        .toast-success { background: #2ecc71; } .toast-error { background: #e74c3c; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .feedback-item { border: 1px solid #eee; padding: 20px; margin-bottom: 15px; border-radius: 8px; background: #f8f9fa; }
        .feedback-item.unread { border-left: 4px solid #e74c3c; background: #fff; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="logo"><i class="fas fa-recycle fa-2x" style="color:#2ecc71;"></i><h2>EcoDescarte</h2></div>
            <ul class="admin-menu">
                <li><a href="#dashboard" class="active" onclick="showTab('dashboard')"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="#pontos" onclick="showTab('pontos')"><i class="fas fa-map-marker-alt"></i> Pontos</a></li>
                <li><a href="#feedbacks" onclick="showTab('feedbacks')"><i class="fas fa-comments"></i> Feedbacks</a></li>
            </ul>
            <div style="padding:20px; border-top:1px solid rgba(255,255,255,0.1); text-align:center; position:absolute; bottom:0; width:100%;">
                <a href="{{ url_for('admin_logout') }}" style="color:#e74c3c;">Sair</a>
            </div>
        </div>

        <div class="admin-main">
            <div class="admin-header"><h1 id="tab-title">Dashboard</h1></div>

            <div id="dashboard" class="admin-tabs active">
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-map-marker-alt" style="color:#2ecc71;"></i><div class="stat-number" id="stat-pontos">0</div>Pontos</div>
                    <div class="stat-card"><i class="fas fa-comments" style="color:#3498db;"></i><div class="stat-number" id="stat-feedbacks">0</div>Feedbacks</div>
                    <div class="stat-card"><i class="fas fa-star" style="color:#f39c12;"></i><div class="stat-number" id="stat-avaliacao">0.0</div>Média</div>
                    <div class="stat-card"><i class="fas fa-envelope" style="color:#e74c3c;"></i><div class="stat-number" id="stat-nao-lidos">0</div>Não Lidos</div>
                </div>
            </div>

            <div id="pontos" class="admin-tabs">
                <div class="tab-content">
                    <button class="btn-action btn-edit" onclick="showTab('novo-ponto')"><i class="fas fa-plus"></i> Novo Ponto</button>
                    <table id="tabela-pontos">
                        <thead><tr><th>ID</th><th>Nome</th><th>Endereço</th><th>Tipos</th><th>Status</th><th>Ações</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="feedbacks" class="admin-tabs">
                <div class="tab-content">
                    <h3>Feedbacks</h3>
                    <div id="lista-feedbacks"></div>
                </div>
            </div>
            
            <div id="novo-ponto" class="admin-tabs">
                <div class="tab-content">
                    <h3>Adicionar Novo Ponto</h3>
                    <form id="form-novo-ponto">
                        <input type="text" id="nome" name="nome" placeholder="Nome do local" required style="width:100%; margin-bottom:10px; padding:10px;">
                        <input type="text" id="endereco" name="endereco" placeholder="Endereço" required style="width:100%; margin-bottom:10px; padding:10px;">
                        <input type="number" id="latitude" name="latitude" step="0.000001" placeholder="Latitude (-23.413)" required style="width:100%; margin-bottom:10px; padding:10px;">
                        <input type="number" id="longitude" name="longitude" step="0.000001" placeholder="Longitude (-51.426)" required style="width:100%; margin-bottom:10px; padding:10px;">
                        <input type="text" id="telefone" name="telefone" placeholder="Telefone" style="width:100%; margin-bottom:10px; padding:10px;">
                        <input type="text" id="horario" name="horario" placeholder="Horário" style="width:100%; margin-bottom:10px; padding:10px;">
                        
                        <label><input type="checkbox" name="tipos_descarte" value="Eletrônicos"> Eletrônicos</label>
                        <label><input type="checkbox" name="tipos_descarte" value="Baterias"> Baterias</label>
                        <label><input type="checkbox" name="tipos_descarte" value="Pilhas"> Pilhas</label>
                        <label><input type="checkbox" name="tipos_descarte" value="Lâmpadas"> Lâmpadas</label><br><br>
                        
                        <button type="submit" class="btn-action btn-success" style="background:#2ecc71;">Salvar Ponto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

        // SEGURANÇA XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showTab(tabName) {
            document.querySelectorAll('.admin-tabs').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-title').textContent = tabName === 'dashboard' ? 'Dashboard' : tabName === 'pontos' ? 'Pontos' : tabName === 'feedbacks' ? 'Feedbacks' : 'Novo Ponto';
            
            if (tabName === 'dashboard') carregarEstatisticas();
            if (tabName === 'pontos') carregarPontos();
            if (tabName === 'feedbacks') carregarFeedbacks();
        }

        async function carregarEstatisticas() {
            const res = await fetch('/admin/api/estatisticas');
            const data = await res.json();
            document.getElementById('stat-pontos').textContent = data.pontos_ativos;
            document.getElementById('stat-feedbacks').textContent = data.total_feedbacks;
            document.getElementById('stat-avaliacao').textContent = data.media_avaliacao;
            document.getElementById('stat-nao-lidos').textContent = data.feedbacks_nao_lidos;
        }

        async function carregarPontos() {
            const res = await fetch('/admin/api/pontos-coleta');
            const pontos = await res.json();
            const tbody = document.querySelector('#tabela-pontos tbody');
            tbody.innerHTML = '';
            pontos.forEach(p => {
                const row = tbody.insertRow();
                // PROTEÇÃO XSS APLICADA AQUI
                row.innerHTML = `
                    <td>${p.id}</td>
                    <td>${escapeHtml(p.nome)}</td>
                    <td>${escapeHtml(p.endereco)}</td>
                    <td>${escapeHtml(p.tipos_descarte.join(', '))}</td>
                    <td>${p.ativo ? 'Ativo' : 'Inativo'}</td>
                    <td><button class="btn-action btn-delete" onclick="excluirPonto(${p.id})"><i class="fas fa-trash"></i></button></td>
                `;
            });
        }

        async function excluirPonto(id) {
            if(!confirm('Excluir?')) return;
            const res = await fetch(`/admin/api/pontos-coleta/${id}`, { 
                method: 'DELETE',
                headers: { 'X-CSRFToken': csrfToken } // PROTEÇÃO CSRF
            });
            if(res.ok) { showToast('Ponto excluído!'); carregarPontos(); }
        }

        document.getElementById('form-novo-ponto').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const tipos = Array.from(formData.getAll('tipos_descarte'));
            if(tipos.length === 0) return showToast('Selecione um tipo!', 'error');
            
            const data = {
                nome: formData.get('nome'), endereco: formData.get('endereco'),
                latitude: parseFloat(formData.get('latitude')), longitude: parseFloat(formData.get('longitude')),
                telefone: formData.get('telefone'), horario_funcionamento: formData.get('horario'),
                tipos_descarte: tipos, ativo: true, oculto: false
            };
            
            const res = await fetch('/admin/api/pontos-coleta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify(data)
            });
            if(res.ok) { showToast('Ponto adicionado!'); this.reset(); showTab('pontos'); }
        });

        async function carregarFeedbacks() {
            const res = await fetch('/admin/api/feedbacks');
            const feedbacks = await res.json();
            const div = document.getElementById('lista-feedbacks');
            div.innerHTML = '';
            feedbacks.forEach(f => {
                div.innerHTML += `
                    <div class="feedback-item ${f.lido ? '' : 'unread'}">
                        <strong>${escapeHtml(f.ponto_nome)}</strong> - ${escapeHtml(f.tipo_feedback)}<br>
                        <p>${escapeHtml(f.comentario)}</p>
                        <button class="btn-action btn-read" onclick="marcarLido(${f.id})">Marcar Lido</button>
                    </div>
                `;
            });
        }

        async function marcarLido(id) {
            const res = await fetch(`/admin/api/feedbacks/${id}/lido`, { 
                method: 'PUT',
                headers: { 'X-CSRFToken': csrfToken }
            });
            if(res.ok) { carregarFeedbacks(); carregarEstatisticas(); }
        }

        document.addEventListener('DOMContentLoaded', () => { carregarEstatisticas(); });
    </script>
</body>
</html>
