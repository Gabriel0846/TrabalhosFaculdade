<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form action="" method="POST">
        <br><br>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" size="50" maxlength="50">
        <br><br>
        <label for="senha">Senha</label>
        <input type="text" type="password" name="senha" size="8" maxlength="8">
        <br><br>
        <fieldset>
            <label for="Linguagem">Linguagem que tem interesse</label>
            <br><br>
            <input type="checkbox" name="Linguagem[]" value="C++">C++
            <input type="checkbox" name="Linguagem[]" value="PHP">PHP
            <input type="checkbox" name="Linguagem[]" value="Delphi">Delphi
        </fieldset>

        <label for="Linguagemescolhida">Linguagem que ira cursar</label>
        <br><br>
        <input type="radio" name="curso" value="C++">C++
        <input type="radio" name="curso" value="PHP">PHP
        <input type="radio" name="curso" value="Delphi">Delphi
        <br><br>

        <select name="Escola">
            <option value="C++">C++</option>
            <option value="PHP">PHP</option>
            <option value="Delphi">Delphi</option>
        </select>
        <br><br>

        <input type="submit" name="submit" id="submit" value="Enviar">
    </form>
</body>
</html>
